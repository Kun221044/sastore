name: Deploy to GitHub Pages

# This repo is one file (index.html) plus this workflow and a CNAME for
# the custom domain. store-app.js — the code that actually builds the
# page — is NOT in this repo; it is rehosted on Team App's own domain
# (app.cungusportracing.com) and loaded cross-origin by the <script src>
# in index.html. See index.html's own comment and
# team-app/claude/session-2026-11-18-storeadmin-integration.md for why.
#
# Every push to main republishes this folder as-is to GitHub Pages —
# there is no build step because there is nothing to build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
